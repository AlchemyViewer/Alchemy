# Read once before a .bvh is uploaded. This file must exist and the line above
# must be its first line.
#
# Lines whose first token starts with # are comments, blank lines are skipped,
# and keys that are not listed here are ignored. A section runs to the next
# heading.
#
# [GLOBALS]
#   emote    = <name>                  none by default
#   priority = <-1..7>                 2
#   loop     = true | false            false
#   loop     = <in> <out>              fractions of the duration; loops
#   easein   = <seconds> <type>        0.3; the type is required and ignored
#   easeout  = <seconds> <type>        0.3; likewise
#   hand     = <0..13>                 1
#
#   constraint        = <chain> <in_start> <in_stop> <out_start> <out_stop>
#                       <source> <sx> <sy> <sz>
#                       <target> <tx> <ty> <tz>
#                       [<dx> <dy> <dz>]
#   planar_constraint = <the same fields>
#
#     chain is 0 to 3 and no more than the number of joints; two is usual.
#     source and target are collision volume names of 15 characters at most.
#     The four times are fractions of the duration. The direction is optional
#     and is normalized when given.
#
# [<joint>]                            named as the .bvh names it
#   ignore      = true | false         drop the joint entirely; false
#   outname     = <name>               the skeleton joint to write it as
#   priority    = <int>                added to the global one, then clamped
#   relativepos = <x> <y> <z>          metres, taken off every position key
#   relativepos = firstkey             take the first key off them instead
#   relativerot = firstkey             rotations relative to the first key
#   frame       = <a b c, d e f, g h i>   coordinate frame, by rows
#   offset      = <a b c, d e f, g h i>   applied after the frame, by rows
#   mergeparent = <joint>              fold that joint's rotation into this one
#   mergechild  = <joint>              likewise
#
#     mergeparent and mergechild name .bvh joints, not skeleton joints, and
#     are read one frame behind. A joint named here overrides what
#     joint_aliases.xml says about it.
#
# [hip]
# outname = mPelvis
# priority = 1
