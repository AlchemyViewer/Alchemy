# The Rust the viewer builds, through Corrosion; see cmake/Velopack.cmake.
# One workspace, so one Cargo.lock pins every crate, and CI keys its crate
# cache on it. pnj2k_libc is a workspace of its own (cmake/Pnj2k.cmake), so
# that only a build with pnj2k fetches pnj2k's repository.
#
# Cargo's default release profile. Velopack's own optimises for size with
# LTO into one code unit, which made velopack_libc a quarter the size and
# its build four times as long; every build tree builds it now, and the
# linker drops what the viewer does not call. Nor would a link that takes
# pnj2k's library beside this one take it with LTO: cmake/Pnj2k.cmake.
[workspace]
resolver = "2"
members = ["velopack_libc"]
exclude = ["pnj2k_libc"]
