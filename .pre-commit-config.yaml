repos:
  - repo: https://github.com/alchemyviewer/git-hooks.git
    rev: v1.0.4
    hooks:
      - id: llsd
      - id: no-trigraphs
      - id: end-of-file
        files: \.(cpp|c|m|mm|h|py|glsl|cmake|txt)$
        exclude: language.txt
      - id: indent-with-spaces
        files: \.(cpp|c|m|mm|h|inl|py|glsl|cmake)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-xml
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace
        files: \.(cpp|c|m|mm|h|inl|py|glsl|cmake|yaml|sh)$
  - repo: local
    hooks:
      - id: raw-gl-newview
        name: Raw GL calls in newview
        entry: python scripts/code_tools/check_raw_gl.py
        language: python
        files: ^indra/newview/.*\.(c|cc|cpp|cxx|h|hh|hpp|inl|m|mm)$
        exclude: ^indra/newview/tests/
      - id: raw-gl-baseline
        name: Raw GL baseline
        entry: python scripts/code_tools/check_raw_gl.py
        language: python
        files: ^scripts/code_tools/(check_raw_gl\.py|raw_gl_baseline\.txt)$
        pass_filenames: false
