name: Tag a Build

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to configure the build"
        required: true
        type: choice
        default: "Test"
        options:
        - "Test"
        - "Develop"
        - "Project"
        - "Beta"
        - "Release"
      project:
        description: "Project Name (used for channel name in project builds, and tag name for all builds)"
        required: false
      tag_override:
        description: "Override the tag name (optional). If the tag already exists, a numeric suffix is appended."
        required: false

permissions: {}

jobs:
  tag-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The tag is created with the GITHUB_TOKEN, so its push starts no build;
    # the build is dispatched on the tag with this run's channel and project.
    # A dispatch is the one event the GITHUB_TOKEN may start a workflow with.
    permissions:
      contents: write
      actions: write
    steps:
      - name: Create Tag and Build It
        uses: actions/github-script@v9
        env:
          # Inputs reach the script through the environment, never pasted
          # into it, so no input can become code.
          CHANNEL: ${{ inputs.channel }}
          PROJECT: ${{ inputs.project }}
          TAG_OVERRIDE: ${{ inputs.tag_override }}
        with:
          script: |
            const channel = process.env.CHANNEL;
            const project = (process.env.PROJECT || '').trim();
            if (channel === 'Project' && !project) {
              core.setFailed('A Project build needs a project name');
              return;
            }
            // A tag name cannot hold spaces; the build reads underscores back as spaces.
            const suffix = project.replace(/\s+/g, '_') || new Date().toISOString().slice(0, 10);
            const override = (process.env.TAG_OVERRIDE || '').trim();
            const baseTag = override || `Alchemy_${channel}#${context.sha.slice(0, 8)}-${suffix}`;

            // Try the base tag first, then append -2, -3, etc. if it already exists
            let tag = baseTag;
            for (let attempt = 1; ; attempt++) {
              try {
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/tags/${tag}`,
                  sha: context.sha
                });
                core.info(`Created tag: ${tag}`);
                break;
              } catch (e) {
                if (e.status === 422 && attempt < 10) {
                  core.info(`Tag '${tag}' already exists, trying next suffix...`);
                  tag = `${baseTag}-${attempt + 1}`;
                } else {
                  throw e;
                }
              }
            }

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yaml',
              ref: `refs/tags/${tag}`,
              inputs: { channel, project }
            });
            core.info(`Dispatched build of ${tag} on the ${channel} channel`);
