name: Tag a Build

on:
  # schedule event triggers always run on the default branch
  # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
  schedule:
    # run "nightly" builds on default branch every fri
    - cron: "21 2 * * 6"     # 2:21am UTC sat == 7:21pm PDT fri -- see https://crontab.guru/#21_01_*_*_2,4,6
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to configure the build"
        required: true
        type: choice
        default: "Test"
        options:
        - "Test"
        - "Develop"
        - "Project"
        - "Beta"
        - "Release"
      project:
        description: "Project Name (used for channel name in project builds, and tag name for all builds)"
        required: false
      tag_override:
        description: "Override the tag name (optional). If the tag already exists, a numeric suffix is appended."
        required: false

# The tag is created with a personal access token, not the GITHUB_TOKEN.
permissions: {}

jobs:
  tag-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Tag
        uses: actions/github-script@v9
        env:
          # Inputs reach the script through the environment, never pasted
          # into it, so no input can become code.
          CHANNEL: ${{ inputs.channel }}
          PROJECT: ${{ inputs.project }}
          TAG_OVERRIDE: ${{ inputs.tag_override }}
        with:
          # use a real access token instead of GITHUB_TOKEN default.
          # required so that the results of this tag creation can trigger the build workflow
          # https://stackoverflow.com/a/71372524
          # https://docs.github.com/en/actions/using-workflows/triggering-a-workflow#triggering-a-workflow-from-a-workflow
          # this token will need to be renewed anually in January
          github-token: ${{ secrets.LL_TAG_RELEASE_TOKEN }}
          script: |
            // A scheduled run has no inputs: a Develop build tagged with the date.
            const channel = process.env.CHANNEL || 'Develop';
            const suffix = process.env.PROJECT || new Date().toISOString().slice(0, 10);
            const override = (process.env.TAG_OVERRIDE || '').trim();
            const baseTag = override || `Alchemy_${channel}#${context.sha.slice(0, 8)}-${suffix}`;

            // Try the base tag first, then append -2, -3, etc. if it already exists
            let tag = baseTag;
            for (let attempt = 1; ; attempt++) {
              try {
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/tags/${tag}`,
                  sha: context.sha
                });
                core.info(`Created tag: ${tag}`);
                break;
              } catch (e) {
                if (e.status === 422 && attempt < 10) {
                  core.info(`Tag '${tag}' already exists, trying next suffix...`);
                  tag = `${baseTag}-${attempt + 1}`;
                } else {
                  throw e;
                }
              }
            }
