name: Sanitizers

# The tests built and run under the sanitizers, on Linux x64 with Clang:
# AddressSanitizer with UndefinedBehaviorSanitizer on every pull request,
# ThreadSanitizer too in the nightly run, and the libFuzzer drivers built in
# an AddressSanitizer tree and run over their corpora on every pull request.
# Every row is advisory: it reports and never fails the run. See
# doc/TESTING.md.

on:
  workflow_dispatch:
  schedule:
    # Nightly, on the default branch.
    - cron: "23 7 * * *"
  pull_request:
    # As the Build workflow's: everything but documentation and the GitHub
    # files no build reads; later patterns win.
    paths:
      - "**"
      - "!**/*.md"
      - "!doc/**"
      - "!LICENSE"
      - "!.github/**"
      - ".github/workflows/sanitizers.yaml"
      - ".github/actions/**"

permissions:
  contents: read

# A new push to a pull request supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.job }})
    strategy:
      fail-fast: false
      matrix:
        # ThreadSanitizer runs many times slower than the tests do, so it
        # waits for the nightly run, or one started by hand. The fuzz row is
        # an AddressSanitizer tree configured with AL_BUILD_FUZZERS, so that
        # the drivers compile and their corpus runs (the entries labelled
        # fuzz) pass, which nothing else builds: a driver that stopped
        # compiling would otherwise be found by whoever next fuzzes by hand.
        job: ${{ fromJSON(github.event_name == 'pull_request' && '["asan", "fuzz"]' || '["asan", "tsan", "fuzz"]') }}
    runs-on: ubuntu-26.04
    continue-on-error: true
    timeout-minutes: ${{ matrix.job == 'tsan' && 340 || 180 }}
    env:
      # The sanitizer preset the row builds with: the fuzz row's is the
      # AddressSanitizer one, which libFuzzer runs on.
      SANITIZER: ${{ matrix.job == 'fuzz' && 'asan' || matrix.job }}
      FUZZERS: ${{ matrix.job == 'fuzz' }}
      BUILD_DIRECTORY: build-Linux-ninja-os-${{ matrix.job == 'fuzz' && 'asan' || matrix.job }}
      # The tests that render on a hidden window, on Mesa's llvmpipe.
      LIBGL_ALWAYS_SOFTWARE: 1
      LOGFAIL: DEBUG
      master_message_template_checkout: ${{ github.workspace }}/.master-message-template
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: "clear"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout master-message-template
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: secondlife/master-message-template
          path: .master-message-template

      # The vcpkg binary cache in R2, as the Build workflow decides it: a
      # protected ref writes it, which the nightly run on the default branch
      # is, a same-repository pull request reads it, and nothing else uses it.
      - name: Decide the vcpkg cache
        id: cache
        shell: bash
        env:
          R2_ENABLED: ${{ vars.VCPKG_R2_ENABLED }}
          REF_PROTECTED: ${{ github.ref_protected }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          mode=
          if [[ "$R2_ENABLED" == "true" && "$GITHUB_ACTOR" != "dependabot[bot]" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              if [[ "$PR_HEAD_REPO" == "$GITHUB_REPOSITORY" ]]; then
                mode="read"
              fi
            elif [[ "$REF_PROTECTED" == "true" ]]; then
              mode="readwrite"
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Set up the build
        uses: ./.github/actions/setup-build
        with:
          r2-cache-mode: ${{ steps.cache.outputs.mode }}
          r2-endpoint-url: ${{ vars.VCPKG_R2_ENDPOINT_URL }}
          r2-bucket: ${{ vars.VCPKG_R2_BUCKET }}
          r2-access-key-id: ${{ steps.cache.outputs.mode == 'readwrite' && secrets.VCPKG_R2_ACCESS_KEY_ID || secrets.VCPKG_R2_READ_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ steps.cache.outputs.mode == 'readwrite' && secrets.VCPKG_R2_SECRET_ACCESS_KEY || secrets.VCPKG_R2_READ_SECRET_ACCESS_KEY }}

      # The sanitizer presets build with Clang and lld, and the sanitizers'
      # runtimes and llvm-symbolizer come with the image's LLVM.
      - name: Install Clang
        shell: bash
        run: sudo apt install -y clang lld llvm libclang-rt-dev

      # The preset turns the tests on and picks the sanitizer triplet, whose
      # ports the cache holds once a protected run has built them. LL's LSL
      # compiler, whose tests and fuzzers are much of what runs here, is
      # required rather than left out when something it needs is missing.
      - name: Configure
        shell: bash
        run: |
          set -x
          cmake -S indra --preset "ninja-os-$SANITIZER" \
            -DVCPKG_INSTALL_OPTIONS=--clean-after-build \
            -DAL_BUILD_VIEWER:BOOL=OFF \
            -DAL_ENABLE_GL_TESTS:BOOL=ON \
            -DAL_REQUIRE_LSCRIPT:BOOL=ON \
            -DAL_BUILD_FUZZERS:BOOL="$FUZZERS" \
            "-DAL_TEMPLATE_VERIFIER_MASTER_URL=file://$master_message_template_checkout/message_template.msg"

      # The fuzz row builds the drivers alone: the tests they would share the
      # tree with run on the asan row.
      - name: Build
        shell: bash
        run: |
          if [[ "$FUZZERS" == "true" ]]; then
            targets=(lscript_fuzz_source lscript_fuzz_program alscript_fuzz_lsl alscript_fuzz_format)
          else
            targets=(BUILD_TESTS)
          fi
          cmake --build "$BUILD_DIRECTORY" --config RelWithDebInfo --target "${targets[@]}" --parallel "$(nproc)"

      # Every entry but the benchmarks: the default run and each binary's run
      # of all its files in one process, combined_pending or not. On the fuzz
      # row, the drivers' corpus runs. An entry fails on a sanitizer's report
      # whatever its exit code.
      - name: Test
        shell: bash
        run: |
          if [[ "$FUZZERS" == "true" ]]; then
            chosen=(-L fuzz)
          else
            chosen=(-LE benchmark)
          fi
          ctest --test-dir "$BUILD_DIRECTORY" -C RelWithDebInfo "${chosen[@]}" \
            --parallel "$(nproc)" --output-on-failure \
            --output-junit Testing/test-results.xml

      # How many reports of each kind, from what CTest kept of every entry's
      # output, for the burn-down.
      - name: Summarize the reports
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JOB: ${{ matrix.job }}
        run: |
          log="$BUILD_DIRECTORY/Testing/Temporary/LastTest.log"
          {
            echo "### $JOB"
            if [[ ! -f "$log" ]]; then
              echo "No test log: the tests did not run."
              exit 0
            fi
            # A leak's summary gives its size where the others give their kind.
            reports="$(grep -oE 'SUMMARY: [A-Za-z]+Sanitizer: [^ ]+( byte\(s\) leaked)?' "$log" |
              sed -E 's/: [0-9]+ byte\(s\) leaked/: leak/' | sort | uniq -c | sort -rn || true)"
            if [[ -z "$reports" ]]; then
              echo "No sanitizer reports."
            else
              echo '```'
              echo "$reports"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: "sanitizer-results-${{ matrix.job }}"
          path: |
            ${{ env.BUILD_DIRECTORY }}/Testing/test-results.xml
            ${{ env.BUILD_DIRECTORY }}/Testing/Temporary/LastTest*.log
          if-no-files-found: warn
