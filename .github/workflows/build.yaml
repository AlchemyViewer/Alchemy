name: Build

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to configure the build"
        required: true
        type: choice
        default: "Auto"
        options:
        - "Auto"
        - "Test"
        - "Develop"
        - "Project"
        - "Beta"
        - "Release"
        - "Release edu"
      project:
        description: "Project Name (used for channel name in Project builds)"
        required: true
        type: string
        default: "hippo"
  pull_request:
  push:
    branches: ["main", "release/*", "beta/*", "project/*"]
    tags: ["Alchemy*"]

permissions:
  contents: read

jobs:
  # The whole point of the setup job is that we want to set variables once
  # that will be consumed by multiple subsequent jobs.
  setup:
    runs-on: ubuntu-latest
    outputs:
      viewer_branch: ${{ steps.which-branch.outputs.branch }}
      relnotes: ${{ steps.which-branch.outputs.relnotes }}
      release_run: ${{ steps.setvar.outputs.release_run }}
      build_type: ${{ steps.setvar.outputs.build_type }}
      sentry_dsn: ${{ steps.setvar.outputs.sentry_dsn }}
      viewer_channel: ${{ steps.setvar.outputs.viewer_channel }}
      is_private_build: ${{ steps.setvar.outputs.is_private_build }}
    env:
      # Build with a tag like "Alchemy#abcdef0" to generate a release page
      # (used for builds we are planning to deploy).
      # When you want to use a string variable as a workflow YAML boolean, it's
      # important to ensure it's the empty string when false. If you omit || '',
      # its value when false is "false", which is interpreted as true.
      RELEASE_RUN: ${{ (github.event.inputs.release_run || github.ref_type == 'tag' && startsWith(github.ref_name, 'Alchemy')) && 'Y' || '' }}
      FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Determine source branch
        id: which-branch
        uses: AlchemyViewer/viewer-build-util/which-branch@v3
        with:
          token: ${{ github.token }}

      - name: Set Variables
        id: setvar
        shell: bash
        env:
          BUILD_VCS_BRANCH: ${{ steps.which-branch.outputs.branch }}
          VIEWER_CHANNEL_BASE: "Alchemy"
          # The Sentry project crash reports go to; unset, the viewer is
          # built without a crash reporter.
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: |
          echo "release_run=$RELEASE_RUN" >> "$GITHUB_OUTPUT"

          if [[ "x$GITHUB_REPOSITORY" == "xAlchemyViewer/AlchemyInternal" ]]; then
            echo 'is_private_build=true' >> $GITHUB_OUTPUT
          else
            echo 'is_private_build=false' >> $GITHUB_OUTPUT
          fi

          if [[ "x$GITHUB_REPOSITORY" != "xAlchemyViewer/Alchemy" || "x$GITHUB_REPOSITORY" != "xAlchemyViewer/AlchemyInternal" ]]; then
            # Non-linden viewer repository run OSS build
            echo 'build_type=opensource' >> $GITHUB_OUTPUT
          elif [[ "$FROM_FORK" == "true" ]]; then
            # PR from fork; don't build with proprietary libs
            echo 'build_type=opensource' >> $GITHUB_OUTPUT
          else
            echo 'build_type=proprietary' >> $GITHUB_OUTPUT
          fi

          # Crash reports go to Sentry on every platform and build type once
          # the repository names a project, but not from a fork's pull
          # request: it has no token to upload the debug files with.
          if [[ -n "$SENTRY_DSN" && "$FROM_FORK" != "true" ]]; then
            echo "sentry_dsn=$SENTRY_DSN" >> "$GITHUB_OUTPUT"
          else
            echo "sentry_dsn=" >> "$GITHUB_OUTPUT"
          fi

          # determine the viewer channel from the branch or tag name
          # trigger an EDU build by including "edu" in the tag
          edu=${{ github.ref_type == 'tag' && contains(github.ref_name, 'edu') }}
          echo "ref_type=${{ github.ref_type }}, ref_name=${{ github.ref_name }}, edu='$edu'"
          branch=$BUILD_VCS_BRANCH
          if [[ "${{inputs.channel}}" != "" && "${{inputs.channel}}" != "Auto" ]];
          then
              if [[ "${{inputs.channel}}" == "Project" ]];
              then
                  export viewer_channel="${{ env.VIEWER_CHANNEL_BASE }} Project ${{inputs.project}}"
              else
                  export viewer_channel="${{ env.VIEWER_CHANNEL_BASE }} ${{inputs.channel}}"
              fi
          elif [[ "$edu" == "true" ]];
          then
              export viewer_channel="${{ env.VIEWER_CHANNEL_BASE }} Release edu"
          elif  [[ "$branch" == "develop" ]];
          then
              export viewer_channel="${{ env.VIEWER_CHANNEL_BASE }} Develop"
          else
              IFS='/' read -ra ba <<< "$branch"
              prefix=${ba[0]}
              if [ "$prefix" == "project" ]; then
                  IFS='_' read -ra prj <<< "${ba[1]}"
                  prj_str="${prj[*]}"
                  # uppercase first letter of each word
                  capitalized=$(echo "$prj_str" | awk '{for (i=1; i<=NF; i++) $i = toupper(substr($i,1,1)) substr($i,2); print}')
                  export viewer_channel="${{ env.VIEWER_CHANNEL_BASE }} Project $capitalized"
              elif  [[ "$prefix" == "release" || "$prefix" == "main" ]];
              then
                  export viewer_channel="${{ env.VIEWER_CHANNEL_BASE }} Release"
              else
                  export viewer_channel="${{ env.VIEWER_CHANNEL_BASE }} Test"
              fi
          fi
          echo "viewer_channel=$viewer_channel" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    permissions:
      packages: write
    strategy:
      matrix:
        runner: ["windows-2025-vs2026", "macos-26", "ubuntu-26.04"]
        configuration: [release]
        arch: [x64, arm64]
        build_variant: [Viewer, Tests]
        exclude:
          # The x86-64 Linux runner cannot build arm64; the arm64 rows below
          # bring their own runner.
          - runner: ubuntu-26.04
            arch: arm64
          - runner: windows-2025-vs2026
            arch: arm64
          - build_variant: Viewer
            configuration: relwithdebinfo
          - build_variant: Viewer
            configuration: optdebug
          - runner: macos-26
            configuration: relwithdebinfo
          - runner: macos-26
            configuration: optdebug
        include:
          # Linux on arm64: NEON is a first-class target, and this is the
          # one row where GCC compiles the SIMD layer for it.
          - runner: ubuntu-26.04-arm
            configuration: release
            arch: arm64
            build_variant: Viewer
          - runner: ubuntu-26.04-arm
            configuration: release
            arch: arm64
            build_variant: Tests

    runs-on: ${{ matrix.runner }}
    outputs:
      viewer_version: ${{ steps.build.outputs.viewer_version }}
      imagename: ${{ steps.build.outputs.imagename }}
      # Windows Velopack outputs (passed to sign-pkg-windows)
      velopack_pack_id:       ${{ steps.build.outputs.velopack_pack_id }}
      velopack_pack_version:  ${{ steps.build.outputs.velopack_pack_version }}
      velopack_pack_authors:  ${{ steps.build.outputs.velopack_pack_authors }}
      velopack_pack_title:    ${{ steps.build.outputs.velopack_pack_title }}
      velopack_main_exe:      ${{ steps.build.outputs.velopack_main_exe }}
      velopack_icon:          ${{ steps.build.outputs.velopack_icon }}
      velopack_splash:        ${{ steps.build.outputs.velopack_splash }}
      velopack_splash_color:  ${{ steps.build.outputs.velopack_splash_color }}
      velopack_installer_base: ${{ steps.build.outputs.velopack_installer_base }}
      # macOS Velopack outputs (passed to sign-pkg-mac)
      velopack_mac_pack_id:      ${{ steps.build.outputs.velopack_mac_pack_id }}
      velopack_mac_pack_version: ${{ steps.build.outputs.velopack_mac_pack_version }}
      velopack_mac_pack_title:   ${{ steps.build.outputs.velopack_mac_pack_title }}
      velopack_mac_main_exe:     ${{ steps.build.outputs.velopack_mac_main_exe }}
      velopack_mac_bundle_id:    ${{ steps.build.outputs.velopack_mac_bundle_id }}
    env:
      # Sets Xcode version used for build
      DEVELOPER_DIR: "/Applications/Xcode_26.6.app/Contents/Developer"
      # Decide if we're building tests or the viewer
      AL_BUILD_VIEWER: ${{ matrix.build_variant == 'Viewer' }}
      AL_BUILD_APPEARANCE_UTILITY: false # ${{ startsWith(matrix.runner, 'ubuntu-') && matrix.build_variant == 'Viewer' }}
      BUILD_TESTS: ${{ matrix.build_variant == 'Tests' }}
      # The tests that render on a hidden window need a GL 4.1 context. The
      # Linux runner gets one from Mesa's llvmpipe through SDL's offscreen
      # driver; the Windows runner has no GPU driver, and macOS is unproven,
      # so they build those suites and register them disabled.
      AL_ENABLE_GL_TESTS: ${{ startsWith(matrix.runner, 'ubuntu-') }}
      LIBGL_ALWAYS_SOFTWARE: 1
      # Build Config
      BUILD_ARCH: ${{ matrix.arch }}
      BUILD_CONFIG: ${{ matrix.configuration }}
      BUILD_TYPE: ${{ needs.setup.outputs.build_type }}
      # Crash reporting: Sentry, wherever the setup job found a DSN
      AL_USE_SENTRY: ${{ needs.setup.outputs.sentry_dsn != '' }}
      AL_SENTRY_DSN: ${{ needs.setup.outputs.sentry_dsn }}
      AL_ENABLE_CRASH_REPORTING: ${{ needs.setup.outputs.sentry_dsn != '' }}
      # Viewer Channel
      AL_CHANNEL: ${{ needs.setup.outputs.viewer_channel }}
      VIEWER_GRID: "agni"
      # Link Time Optimization
      AL_USE_LTO: ${{ matrix.configuration == 'release' }}
      # Setting this variable directs Linden's TUT test driver code to capture
      # test-program log output at the specified level, but to display it only if
      # the individual test fails.
      LOGFAIL: DEBUG
      master_message_template_checkout: ${{ github.workspace }}/.master-message-template
      # vcpkg Setup
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_USERNAME: ${{ github.repository_owner }}
      # VCPKG_FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      # VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite"
    steps:
      - name: Linux Dependency Install and Disk Cleanup
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            autoconf autoconf-archive automake bison build-essential cmake curl flex gettext \
            libasound2-dev libaudio-dev libdbus-1-dev libdbus-1-dev libdecor-0-dev libdrm-dev \
            libegl1-mesa-dev libfribidi-dev libgbm-dev libgl1-mesa-dev libgl1-mesa-dri libgles2-mesa-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer1.0-dev libibus-1.0-dev libjack-dev libltdl-dev \
            libpipewire-0.3-dev libpulse-dev libsndio-dev libtext-unidecode-perl \
            libthai-dev libtool libudev-dev libunwind-dev liburing-dev libvlc-dev libwayland-dev \
            libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxft-dev libxi-dev libxinerama-dev \
            libxkbcommon-dev libxrandr-dev libxss-dev libxtst-dev linux-libc-dev mono-complete \
            nasm ninja-build pkgconf tar tex-common texinfo unzip zip

          sudo locale-gen en_US.UTF-8
          sudo locale-gen en_GB.UTF-8
          sudo locale-gen fr_FR.UTF-8

          df -h
          sudo docker container prune -f
          sudo docker image prune -a -f
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          df -h

      - name: macOS Homebrew Dependency Install
        if: runner.os == 'macOS'
        run: |
          brew install autoconf autoconf-archive automake libtool mono nasm unzip zip

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout master-message-template
        uses: actions/checkout@v7
        with:
          repository: secondlife/master-message-template
          path: .master-message-template

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Linux builds with the CMake floor, so the floor is a floor.
      - name: Install python dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]
          then pip3 install llsd cmake==4.0.0 ninja
          else pip3 install llsd cmake ninja
          fi

      - name: Bootstrap vcpkg Windows
        if: runner.os == 'Windows'
        run: |
          ./vcpkg/bootstrap-vcpkg.bat

      - name: Bootstrap vcpkg non-Windows
        if: runner.os == 'macOS' || runner.os == 'Linux'
        run: |
          ./vcpkg/bootstrap-vcpkg.sh

      # - name: Set up vcpkg nuget caching
      #   shell: bash
      #   run: |
      #     if [[ "$RUNNER_OS" == "Windows" ]]
      #     then
      #       $(${VCPKG_ROOT}/vcpkg fetch nuget | tail -n 1) \
      #         sources add \
      #         -Source "${{ env.VCPKG_FEED_URL }}" \
      #         -StorePasswordInClearText \
      #         -Name GitHubPackages \
      #         -UserName "${{ env.VCPKG_USERNAME }}" \
      #         -Password "${{ secrets.GITHUB_TOKEN }}"
      #       $(${VCPKG_ROOT}/vcpkg fetch nuget | tail -n 1) \
      #         setapikey "${{ secrets.GITHUB_TOKEN }}" \
      #         -Source "${{ env.VCPKG_FEED_URL }}"
      #     else
      #       mono $(${VCPKG_ROOT}/vcpkg fetch nuget | tail -n 1) \
      #         sources add \
      #         -Source "${{ env.VCPKG_FEED_URL }}" \
      #         -StorePasswordInClearText \
      #         -Name GitHubPackages \
      #         -UserName "${{ env.VCPKG_USERNAME }}" \
      #         -Password "${{ secrets.GITHUB_TOKEN }}"
      #       mono $(${VCPKG_ROOT}/vcpkg fetch nuget | tail -n 1) \
      #         setapikey "${{ secrets.GITHUB_TOKEN }}" \
      #         -Source "${{ env.VCPKG_FEED_URL }}"
      #     fi

      - name: Cache Rust Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Configure
        id: configure
        shell: bash
        run: |
          set -x

          # Set VCPKG root
          export VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT

          [ -n "$master_message_template_checkout" ] \
          && [ -r "$master_message_template_checkout/message_template.msg" ] \
          && template_verifier_master_url="-DAL_TEMPLATE_VERIFIER_MASTER_URL=file://$master_message_template_checkout/message_template.msg"

          cmake_preset_postfix=""
          if [[ "$BUILD_TYPE" != "proprietary" ]]
          then
            cmake_preset_postfix="-os"
          fi

          SIGNING=()
          case "$RUNNER_OS" in
            Windows)
              cmake_preset_name="vs2026${cmake_preset_postfix}-fullopt"
              build_directory="build-Windows-$cmake_preset_name"
              vcpkg_triplet="x64-windows-alchemy-avx2-release"
              ;;
            macOS)
              cmake_preset_name="ninja${cmake_preset_postfix}-fullopt-$BUILD_ARCH"
              build_directory="build-Darwin-$cmake_preset_name"
              vcpkg_triplet="$BUILD_ARCH-osx-alchemy-release"
              ;;
            Linux)
              cmake_preset_name="ninja${cmake_preset_postfix}-fullopt"
              build_directory="build-Linux-$cmake_preset_name"
              if [[ "$BUILD_ARCH" == "arm64" ]]
              then
                vcpkg_triplet="arm64-linux-alchemy-release"
              else
                vcpkg_triplet="x64-linux-alchemy-avx2-release"
              fi
              ;;
          esac

          echo "build_directory=$build_directory" >> "$GITHUB_OUTPUT"
          echo "cmake_preset=$cmake_preset_name" >> "$GITHUB_OUTPUT"

          cmake -S indra --preset $cmake_preset_name \
            -DVCPKG_TARGET_TRIPLET="$vcpkg_triplet" \
            -DAL_BUILD_VIEWER:BOOL="$AL_BUILD_VIEWER" \
            -DAL_BUILD_APPEARANCE_UTILITY:BOOL="$AL_BUILD_APPEARANCE_UTILITY" \
            -DAL_BUILD_TESTS:BOOL="$BUILD_TESTS" \
            -DAL_ENABLE_GL_TESTS:BOOL="$AL_ENABLE_GL_TESTS" \
            -DAL_BUILD_PACKAGE:BOOL=ON \
            -DAL_USE_VELOPACK:BOOL=ON \
            -DAL_USE_LTO:BOOL="$AL_USE_LTO" \
            -DAL_ENABLE_RELEASE_DEBUG_LOGGING:BOOL=OFF \
            -DAL_ENABLE_CRASH_REPORTING:BOOL="$AL_ENABLE_CRASH_REPORTING" \
            -DAL_USE_SENTRY:BOOL="$AL_USE_SENTRY" \
            -DAL_SENTRY_DSN:STRING="$AL_SENTRY_DSN" \
            -DAL_CHANNEL:STRING="${AL_CHANNEL}" \
            -DAL_GRID:STRING="\"$VIEWER_GRID\"" \
            $template_verifier_master_url \
            "${SIGNING[@]}"

      - name: Build
        id: build
        shell: bash
        env:
          BUILD_DIRECTORY: ${{ steps.configure.outputs.build_directory }}
          CMAKE_PRESET_NAME: ${{ steps.configure.outputs.cmake_preset }}
          CTEST_OUTPUT_ON_FAILURE: 1 # Output log on test failure
        working-directory: "${{ github.workspace }}/indra"
        run: |
          set -x

          # Set VCPKG root
          export VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT

          if $BUILD_TESTS
          then
            # Now build the tests. We want to build them in a separate step before running them.
            cmake --build --preset $CMAKE_PRESET_NAME-$BUILD_CONFIG

            # Now that we've built the tests, we can run them to validate the build.
            # If the tests fail, their output will be visible in the logs due to
            # CTEST_OUTPUT_ON_FAILURE above, and the build step will be marked as failed.
            cmake --build --preset $CMAKE_PRESET_NAME-$BUILD_CONFIG --target BUILD_AND_RUN_TESTS
          elif $AL_BUILD_VIEWER
          then
            cmake --build --preset $CMAKE_PRESET_NAME-$BUILD_CONFIG || fatal "failed building $BUILD_CONFIG viewer"
          else
            echo "::notice::Skipping build due to both viewer and tests being disabled"
          fi

          # Each artifact is downloaded as a distinct .zip file. Multiple jobs
          # (per the matrix above) writing the same filepath to the same
          # artifact name will *overwrite* that file. Moreover, they can
          # interfere with each other, causing the upload to fail.
          # https://github.com/actions/upload-artifact#uploading-to-the-same-artifact
          # Given the size of our installers, and the fact that we typically
          # only want to download just one instead of a single zip containing
          # several, generate a distinct artifact name for each installer.
          # If the matrix above can run multiple builds on the same
          # platform, we must disambiguate on more than the platform name.
          # e.g. if we were still running Windows 32-bit builds, we'd need to
          # qualify the artifact with bit width.
          if [[ "$BUILD_TYPE" != "proprietary" ]]
          then cfg_suffix='-OS'
          else cfg_suffix=''
          fi
          echo "artifact=$RUNNER_OS$cfg_suffix-$BUILD_ARCH" >> $GITHUB_OUTPUT

          # Gather version metadata
          if [ -r "$BUILD_DIRECTORY/newview/viewer_version.txt" ]
          then
              viewer_version="$(<"$BUILD_DIRECTORY/newview/viewer_version.txt")"
              echo "viewer_version=$viewer_version" >> "$GITHUB_OUTPUT"
          fi

          # The package: the install tree on Windows, which the signing job
          # packages with Velopack; the CPack archive elsewhere. The names
          # the packaging steps need come from the configure.
          if $AL_BUILD_VIEWER
          then
            case "$BUILD_CONFIG" in
              release) cmake_config=Release ;;
              relwithdebinfo) cmake_config=RelWithDebInfo ;;
              optdebug) cmake_config=OptDebug ;;
              *) cmake_config=Debug ;;
            esac
            cat "$BUILD_DIRECTORY/newview/package.env" >> "$GITHUB_OUTPUT"
            case "$RUNNER_OS" in
              Windows)
                cmake --install "$BUILD_DIRECTORY" --config "$cmake_config" --prefix "$RUNNER_TEMP/app"
                echo "viewer_app=$RUNNER_TEMP/app" >> "$GITHUB_OUTPUT"
                ;;
              *)
                cpack --config "$BUILD_DIRECTORY/CPackConfig.cmake" -C "$cmake_config" -B "$RUNNER_TEMP/package"
                viewer_app="$(ls "$RUNNER_TEMP"/package/*.tar.xz "$RUNNER_TEMP"/package/*.dmg 2>/dev/null | head -n 1)"
                echo "viewer_app=$viewer_app" >> "$GITHUB_OUTPUT"
                ;;
            esac
          fi

      - name: Upload executable
        uses: actions/upload-artifact@v7
        if: matrix.configuration == 'release' && matrix.build_variant == 'Viewer'
        with:
          name: "${{ steps.build.outputs.artifact }}-app"
          if-no-files-found: error
          compression-level: 9
          path: |
            ${{ steps.build.outputs.viewer_app }}

      # The other upload of nontrivial size is the symbol file. Use a distinct
      # artifact for that too.
      - name: Upload Windows symbol file
        uses: actions/upload-artifact@v7
        if: runner.os == 'Windows' && matrix.configuration == 'release' && matrix.build_variant == 'Viewer' && needs.setup.outputs.sentry_dsn != ''
        with:
          name: "${{ steps.build.outputs.artifact }}-symbols"
          if-no-files-found: error
          path: |
            ${{ steps.configure.outputs.build_directory }}/symbols/Release/${{ needs.setup.outputs.viewer_channel }}.sym.tar.xz

      - name: Upload macOS symbol file
        uses: actions/upload-artifact@v7
        if: runner.os == 'macOS' && matrix.configuration == 'release' && matrix.build_variant == 'Viewer' && needs.setup.outputs.sentry_dsn != ''
        with:
          name: "${{ steps.build.outputs.artifact }}-symbols"
          if-no-files-found: error
          path: |
            ${{ steps.configure.outputs.build_directory }}/symbols/Release/${{ needs.setup.outputs.viewer_channel }}.xcarchive.zip

      - name: Upload Linux symbol file
        uses: actions/upload-artifact@v7
        if: runner.os == 'Linux' && matrix.configuration == 'release' && matrix.build_variant == 'Viewer' && needs.setup.outputs.sentry_dsn != ''
        with:
          name: "${{ steps.build.outputs.artifact }}-symbols"
          if-no-files-found: error
          path: |
            ${{ steps.configure.outputs.build_directory }}/symbols/Release/${{ needs.setup.outputs.viewer_channel }}.sym.tar.xz

      - name: Upload metadata
        uses: actions/upload-artifact@v7
        if: matrix.configuration == 'release' && matrix.build_variant == 'Viewer'
        with:
          name: "${{ steps.build.outputs.artifact }}-metadata"
          if-no-files-found: error
          compression-level: 9
          path: |
            ${{ steps.configure.outputs.build_directory }}/newview/viewer_version.txt

      # Sentry symbolicates a crash report with the debug files of the
      # binaries that shipped, in pairs: PE and PDB, Mach-O and dSYM, ELF and
      # its split .debug. The build tree still holds both halves side by side.
      - name: Upload debug files to Sentry
        if: matrix.configuration == 'release' && matrix.build_variant == 'Viewer' && needs.setup.outputs.sentry_dsn != ''
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          BUILD_DIRECTORY: ${{ steps.configure.outputs.build_directory }}
        run: |
          set -x

          if [[ -z "$SENTRY_AUTH_TOKEN" || -z "$SENTRY_ORG" || -z "$SENTRY_PROJECT" ]]; then
            echo "::error::SENTRY_DSN is set but SENTRY_AUTH_TOKEN, SENTRY_ORG or SENTRY_PROJECT is not; crash reports would go unsymbolicated"
            exit 1
          fi

          pip3 install sentry-cli==3.7.0

          case "$RUNNER_OS" in
            Windows)
              candidates=(
                "$BUILD_DIRECTORY/newview/Release"
                "$BUILD_DIRECTORY/symbols/Release"
                "$BUILD_DIRECTORY/dullahan/Release"
              )
              ;;
            macOS)
              candidates=(
                "$BUILD_DIRECTORY"/newview/Release/*.app/Contents/MacOS
                "$BUILD_DIRECTORY"/newview/Release/*.app/Contents/Frameworks
                "$BUILD_DIRECTORY"/newview/Release/*.app/Contents/Resources/llplugin
                "$BUILD_DIRECTORY/symbols/Release"
              )
              ;;
            Linux)
              candidates=(
                "$BUILD_DIRECTORY/newview/Release/bin"
                "$BUILD_DIRECTORY/newview/Release/llplugin"
                "$BUILD_DIRECTORY/symbols/Release"
              )
              ;;
          esac

          paths=()
          for candidate in "${candidates[@]}"; do
            [[ -e "$candidate" ]] && paths+=("$candidate")
          done

          sentry-cli debug-files upload --include-sources --wait "${paths[@]}"

      # - name: Upload appearance utility package
      #   uses: actions/upload-artifact@v7
      #   if: runner.os == 'Linux' && matrix.configuration == 'release' && matrix.build_variant == 'Viewer'
      #   with:
      #     name: "${{ steps.build.outputs.artifact }}-appearanceutility"
      #     path: |
      #       ${{ steps.configure.outputs.build_directory }}/llappearanceutility/Release/appearance-utility-bin
      #       ${{ steps.configure.outputs.build_directory }}/llappearanceutility/Release/appearance-utility-headless-bin

  sign-and-package-windows:
    needs: [setup, build]
    runs-on: windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET for Velopack
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Install Velopack CLI
        run: dotnet tool restore

      - name: Fetch Windows app
        uses: actions/download-artifact@v8
        if: needs.setup.outputs.build_type == 'proprietary'
        with:
          name: Windows-x64-app
          path: .app

      - name: Fetch Windows OS app
        uses: actions/download-artifact@v8
        if: needs.setup.outputs.build_type != 'proprietary'
        with:
          name: Windows-OS-x64-app
          path: .app

      - name: Build and sign Velopack package
        shell: bash
        env:
          PACK_ID: ${{ needs.build.outputs.velopack_pack_id }}
          PACK_VERSION: ${{ needs.build.outputs.velopack_pack_version }}
          PACK_TITLE: ${{ needs.build.outputs.velopack_pack_title }}
          PACK_AUTHORS: ${{ needs.build.outputs.velopack_pack_authors }}
          MAIN_EXE: ${{ needs.build.outputs.velopack_main_exe }}
          ICON: ${{ needs.build.outputs.velopack_icon }}
          SPLASH_IMAGE: ${{ needs.build.outputs.velopack_splash }}
          SPLASH_COLOR: ${{ needs.build.outputs.velopack_splash_color }}
          INSTALLER_BASE: ${{ needs.build.outputs.velopack_installer_base }}
        run: |
          set -x

          vpk_args=(
            dotnet vpk pack
            --packId "$PACK_ID"
            --packVersion "$PACK_VERSION"
            --packAuthors "$PACK_AUTHORS"
            --packDir .app
            --mainExe "$MAIN_EXE"
            --packTitle "$PACK_TITLE"
            --shortcuts ''
            --splashProgressColor "$SPLASH_COLOR"
          )

          # Add icon if provided
          if [[ -n "$ICON" && -f ".app/$ICON" ]]; then
            vpk_args+=(--icon ".app/$ICON")
          fi

          # Add splash if provided
          if [[ -n "$SPLASH_IMAGE" && -f ".app/$SPLASH_IMAGE" ]]; then
            vpk_args+=(--splashImage ".app/$SPLASH_IMAGE")
          fi

          "${vpk_args[@]}"

      - name: Rename Velopack outputs
        shell: bash
        env:
          PACK_ID: ${{ needs.build.outputs.velopack_pack_id }}
          INSTALLER_BASE: ${{ needs.build.outputs.velopack_installer_base }}
        run: |
          # Move Setup.exe into .app for the installer upload step
          setup="Releases/${PACK_ID}-win-Setup.exe"
          if [[ -f "$setup" ]]; then
            mv "$setup" ".app/${INSTALLER_BASE}_Setup.exe"
            echo "Moved $setup to .app/${INSTALLER_BASE}_Setup.exe"
          fi

          # Rename Portable.zip to include version
          portable="Releases/${PACK_ID}-win-Portable.zip"
          if [[ -f "$portable" ]]; then
            mv "$portable" "Releases/${INSTALLER_BASE}_Portable.zip"
            echo "Moved $portable to Releases/${INSTALLER_BASE}_Portable.zip"
          fi

      - name: Find Velopack installer
        id: find-installer
        shell: bash
        run: |
          installer="$(ls -t .app/*_Setup.exe 2>/dev/null | head -n 1 || true)"
          if [[ -z "$installer" ]]; then
            echo "::error::No Velopack installer found under .app"
            exit 1
          fi
          echo "installer=$installer" >> "$GITHUB_OUTPUT"

      - name: Post the installer
        uses: actions/upload-artifact@v7
        with:
          name: "Windows-installer"
          path: ${{ steps.find-installer.outputs.installer }}
          if-no-files-found: error

      - name: Upload Velopack releases
        uses: actions/upload-artifact@v7
        with:
          name: "Windows-releases"
          path: Releases/
          if-no-files-found: error

