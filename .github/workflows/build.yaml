  release:
    needs: [setup, build, sign-and-package-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: needs.setup.outputs.release_run
    permissions:
      # Creates the release, generates its notes and uploads its assets.
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-installer"

      - uses: actions/download-artifact@v8
        with:
          pattern: "*-releases"

      - uses: actions/download-artifact@v8
        with:
          name: "Linux${{ needs.setup.outputs.build_suffix }}-x64-app"

      - uses: actions/download-artifact@v8
        with:
          name: "Linux${{ needs.setup.outputs.build_suffix }}-arm64-app"

      # forked from softprops/action-gh-release
      - name: Create GitHub release
        id: release
        uses: AlchemyViewer/action-gh-release@v3
        with:
          # name the release page for the branch. We want channel and version.
          name: "${{ needs.setup.outputs.viewer_channel }} ${{ needs.build.outputs.viewer_version }}"
          # The tag's pull request notes after "relnotes:", if any, ahead of
          # the generated notes.
          body: ${{ needs.setup.outputs.relnotes }}
          prerelease: true
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          append_body: true
          fail_on_unmatched_files: true
          files: |
            Windows*-installer/*.exe
            *.tar.xz
            Windows*-releases/*

      - name: post release URL
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          echo "::notice::Release $RELEASE_URL"
