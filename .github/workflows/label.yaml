name: Pull Request Labeler
on:
  - pull_request_target

permissions: {}

jobs:
  triage:
    # Applying labels needs pull-requests: write. Creating one would need
    # issues: write as well, so every label in labeler.yaml must already
    # exist in the repository.
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yaml
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
